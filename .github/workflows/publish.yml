name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Upgrade npm to 11.x (required for trusted publishing)
        run: npm install -g npm@11

      - name: Install dependencies
        working-directory: js/connect
        run: npm ci

      - name: Build
        working-directory: js/connect
        run: npm run build

      - name: Show npm config
        working-directory: js/connect
        run: |
          echo "npm version: $(npm --version)"
          echo "registry: $(npm config get registry)"
          echo "node version: $(node --version)"

      - name: Publish
        working-directory: js/connect
        run: npm publish

      - name: Verify publish
        working-directory: js/connect
        run: |
          echo "=== verify published version ==="
          npm view @alaikis/translation-sdk version --registry=https://registry.npmjs.org || echo "npm view failed"
